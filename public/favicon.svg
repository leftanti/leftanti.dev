<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="leftanti">
  <!--
    The site mark: a left anti join. The left circle is filled with the
    intersection cut away; the right circle is an unfilled outline. Same shape
    as src/components/LogoMark.astro, redrawn at 32x32 with a heavier stroke so
    the outline survives a 16px tab icon.

    THE ONE PLACE IN THE REPO WHERE COLOUR IS WRITTEN OUTSIDE theme.css. A
    favicon cannot read CSS custom properties, so the three values below are
    hand copies. Retune any of them in src/styles/theme.css and you must retune
    them here by hand; nothing will warn you.

      #0f100f  is the custom property named bg
      #6fae94  is brand, the canonical green, which matches section-detections
      #3f4441  is comment-mark

    Those names are written without their leading pair of dashes on purpose: a
    double hyphen is illegal inside an XML comment and silently breaks the file
    for anything that parses SVG strictly, which includes loading it as an
    image.

    The cut circle's radius is the outline's radius plus half its stroke, so
    the fill stops exactly at the outer edge of the outline.
  -->
  <rect width="32" height="32" rx="7" fill="#0f100f" />

  <clipPath id="anti-join" clipPathUnits="userSpaceOnUse">
    <path clip-rule="evenodd" d="M0 0 H32 V32 H0 Z M29 16 A8.25 8.25 0 0 1 12.5 16 A8.25 8.25 0 0 1 29 16 Z" />
  </clipPath>

  <!-- Left table, minus the matches. -->
  <circle cx="10.75" cy="16" r="7.5" fill="#6fae94" clip-path="url(#anti-join)" />

  <!-- Right table: outlined, never filled. -->
  <circle cx="20.75" cy="16" r="7.5" fill="none" stroke="#3f4441" stroke-width="1.5" />
</svg>
